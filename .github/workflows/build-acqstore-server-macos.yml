name: Build AcqStore Server macOS
run-name: Build AcqStore Server macOS • ${{ github.ref_name }}

on:
  # Manual only — no tag/push auto-runs. Select branch in Actions → Run workflow.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-acqstore-server-macos:
    name: Build signed and notarized AcqStore Server.app
    runs-on: macos-14

    env:
      NOTARY_PROFILE: acqstore-server-ci-notary-profile
      ACQSTORE_SERVER_NATIVE: '1'
      ACQSTORE_SERVER_HOST: '127.0.0.1'
      ACQSTORE_SERVER_PORT: '8767'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Keep packaging on the same tested uv release as CloudScope macOS CI.
          version: '0.9.2'
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Validate dependency lock
        shell: bash
        run: uv lock --check

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate tag/version consistency
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED="v${VERSION}"

          if [[ "${TAG}" != "${EXPECTED}" ]]; then
            echo "ERROR: tag '${TAG}' does not match pyproject.toml version '${VERSION}'. Expected '${EXPECTED}'." >&2
            exit 1
          fi

          echo "OK: tag '${TAG}' matches pyproject.toml version '${VERSION}'."

      - name: Validate required secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
        run: |
          for name in \
            MACOS_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            MACOS_SIGN_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "ERROR: missing GitHub secret: $name" >&2
              exit 2
            fi
          done

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/acqstore-server-build.keychain-db"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Create notarytool profile and packaging secrets
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          cat > packaging/acqstore_server/_secrets.sh <<EOF
          #!/usr/bin/env bash
          export SIGN_ID='$MACOS_SIGN_ID'
          export NOTARY_PROFILE='$NOTARY_PROFILE'
          EOF

          chmod 600 packaging/acqstore_server/_secrets.sh

      # App creation is owned by packaging/acqstore_server/build_app.sh so local
      # smoke tests and CI release builds share one locked packaging path.
      - name: Build app
        shell: bash
        run: ./packaging/acqstore_server/build_app.sh

      - name: Sign and create notarization zip
        shell: bash
        run: ./packaging/acqstore_server/codesign_and_zip.sh

      - name: Submit for notarization
        shell: bash
        run: ./packaging/acqstore_server/notary_submit.sh

      - name: Poll notarization
        shell: bash
        run: ./packaging/acqstore_server/notary_poll_until_done.sh

      - name: Staple and verify
        shell: bash
        run: ./packaging/acqstore_server/staple_and_verify.sh

      - name: Create final macOS release zip
        shell: bash
        run: ./packaging/acqstore_server/make_release_zip.sh

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcqStore-Server-macos-release-assets
          path: |
            packaging/acqstore_server/dist/AcqStore-Server-*-macos.zip
            packaging/acqstore_server/dist/AcqStore-Server-*-macos.zip.sha256
            packaging/acqstore_server/dist/AcqStore-Server-*-macos-manifest.json
          if-no-files-found: error

      - name: Upload macOS app to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          ASSETS=(
            packaging/acqstore_server/dist/AcqStore-Server-*-macos.zip
            packaging/acqstore_server/dist/AcqStore-Server-*-macos.zip.sha256
            packaging/acqstore_server/dist/AcqStore-Server-*-macos-manifest.json
          )

          if [[ "${#ASSETS[@]}" -eq 0 ]]; then
            echo "ERROR: no AcqStore Server macOS release assets found." >&2
            exit 1
          fi

          for attempt in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              exit 0
            fi
            echo "Waiting for GitHub Release $TAG to exist..."
            sleep 10
          done

          echo "ERROR: GitHub Release $TAG was not found after waiting." >&2
          exit 1
