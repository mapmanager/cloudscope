name: Build Windows
run-name: Build Windows • ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build unsigned Windows app artifact
    # Pin image so release packaging does not silently follow windows-latest churn.
    runs-on: windows-2022

    env:
      CLOUDSCOPE_NATIVE: '1'
      CLOUDSCOPE_REMOTE: '0'
      CLOUDSCOPE_RELOAD: '0'
      CLOUDSCOPE_SINGLE_WINDOW: '1'
      CLOUDSCOPE_STORAGE_SECRET: cloudscope-packaged-app-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Keep macOS and Windows packaging on the same tested uv release.
          version: '0.9.2'
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Validate dependency lock
        shell: pwsh
        run: uv lock --check

      # Sync once into the project .venv, then call its executables directly.
      # Do not use bare `uv run` afterward: it can re-sync default groups (including
      # `dev`) and undo --no-dev --group build. Matches macOS build_app.sh.
      - name: Install locked packaging dependencies
        run: uv sync --locked --no-dev --group build

      - name: Log packaging environment
        shell: pwsh
        run: |
          uv --version
          .\.venv\Scripts\python.exe --version
          .\.venv\Scripts\python.exe -c "import importlib.metadata as m; print('nicegui', m.version('nicegui')); print('pywebview', m.version('pywebview')); print('pyinstaller', m.version('pyinstaller'))"

      - name: Resolve project version
        id: version
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "artifact_name=CloudScope-v$version-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Validate tag/version consistency
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $expected = "v$version"
          if ($tag -ne $expected) {
            Write-Error "Tag '$tag' does not match pyproject.toml version '$version'. Expected '$expected'."
            exit 1
          }
          Write-Host "OK: tag '$tag' matches pyproject.toml version '$version'."

      - name: Write build metadata
        shell: pwsh
        run: |
          $commit = git rev-parse --short HEAD
          $date = Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ"
          $version = "${{ steps.version.outputs.version }}"
          @"
          APP_NAME = "CloudScope"
          VERSION = "$version"
          GIT_COMMIT = "$commit"
          BUILD_DATE = "$date"
          BUILD_PLATFORM = "windows-x64"
          "@ | Set-Content -Encoding UTF8 src/cloudscope/_build_info.py

      - name: Build Windows app
        shell: pwsh
        run: >
          .\.venv\Scripts\nicegui-pack.exe
          --windowed
          --clean
          --name CloudScope
          --icon packaging/assets/CloudScope.ico
          src/cloudscope/app.py

      - name: Verify Windows app output
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "dist/CloudScope" -PathType Container)) {
            Write-Error "Expected Windows app directory was not created: dist/CloudScope"
            exit 1
          }

      - name: Archive Windows app
        shell: pwsh
        run: |
          $artifactName = "${{ steps.version.outputs.artifact_name }}"
          if (Test-Path "package") {
            Remove-Item -Path "package" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "package" | Out-Null
          Copy-Item -Path "dist/CloudScope" -Destination "package/CloudScope" -Recurse
          Compress-Archive `
            -Path package/CloudScope `
            -DestinationPath "$artifactName.zip" `
            -Force

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifactName = "${{ steps.version.outputs.artifact_name }}"
          Get-FileHash "$artifactName.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $artifactName.zip" } |
            Set-Content -Encoding ASCII "$artifactName.zip.sha256"

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ steps.version.outputs.artifact_name }}.zip
            ${{ steps.version.outputs.artifact_name }}.zip.sha256
          if-no-files-found: error

      - name: Upload Windows app to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.version.outputs.artifact_name }}.zip
          CHECKSUM: ${{ steps.version.outputs.artifact_name }}.zip.sha256
        shell: bash
        run: |
          for attempt in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$ASSET" "$CHECKSUM" --clobber
              exit 0
            fi
            echo "Waiting for GitHub Release $TAG to exist..."
            sleep 10
          done

          echo "ERROR: GitHub Release $TAG was not found after waiting." >&2
          exit 1