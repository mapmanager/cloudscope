<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">CloudScope architecture</title>
  <desc id="desc">CloudScope desktop, browser, and notebook workflows share the acqstore scientific backend.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 z" fill="#2f5f8f" />
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2f5f8f; stroke-width: 3; rx: 14; }
      .backend { fill: #eef6ff; stroke: #174a7c; stroke-width: 4; rx: 16; }
      .subbox { fill: #f7f9fb; stroke: #7a8ea3; stroke-width: 2; rx: 10; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .small { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263b4f; }
      .tiny { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40566b; }
      .line { stroke: #2f5f8f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="490" y="44" text-anchor="middle" class="title">CloudScope desktop, web, and scripts share one scientific backend</text>

  <rect x="70" y="86" width="240" height="100" class="box" />
  <text x="190" y="126" text-anchor="middle" class="label">Desktop App</text>
  <text x="190" y="154" text-anchor="middle" class="small">macOS · Windows</text>

  <rect x="370" y="86" width="240" height="100" class="box" />
  <text x="490" y="126" text-anchor="middle" class="label">Browser App</text>
  <text x="490" y="154" text-anchor="middle" class="small">cloudscope.mapmanager.net</text>

  <rect x="670" y="86" width="240" height="100" class="box" />
  <text x="790" y="126" text-anchor="middle" class="label">Scripts &amp; Notebooks</text>
  <text x="790" y="154" text-anchor="middle" class="small">Python workflows</text>

  <path d="M190 186 C190 235 330 250 390 278" class="line" />
  <path d="M490 186 L490 274" class="line" />
  <path d="M790 186 C790 235 650 250 590 278" class="line" />

  <rect x="220" y="274" width="540" height="116" class="backend" />
  <text x="490" y="315" text-anchor="middle" class="label">acqstore scientific backend</text>
  <text x="490" y="345" text-anchor="middle" class="small">file loading · metadata · ROIs · analysis · results</text>
  <text x="490" y="370" text-anchor="middle" class="tiny">Full-resolution analysis with shared code paths for GUI and scripts</text>

  <rect x="95" y="430" width="220" height="58" class="subbox" />
  <text x="205" y="464" text-anchor="middle" class="small">Commercial formats</text>
  <text x="205" y="483" text-anchor="middle" class="tiny">OIR · CZI</text>

  <rect x="380" y="430" width="220" height="58" class="subbox" />
  <text x="490" y="464" text-anchor="middle" class="small">Open formats</text>
  <text x="490" y="483" text-anchor="middle" class="tiny">TIFF · OME-Zarr</text>

  <rect x="665" y="430" width="220" height="58" class="subbox" />
  <text x="775" y="464" text-anchor="middle" class="small">Analysis</text>
  <text x="775" y="483" text-anchor="middle" class="tiny">velocity · diameter · sum intensity</text>

  <path d="M390 390 C330 415 270 420 205 430" class="line" />
  <path d="M490 390 L490 430" class="line" />
  <path d="M590 390 C650 415 710 420 775 430" class="line" />
</svg>
