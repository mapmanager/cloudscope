# NiceGUI multi-window/multi-tab demo.
#
# Build and run:
#   docker compose up --build -d
#
# Then visit:
#   http://localhost:8081
#
# The app listens on container port 8080. The host maps 8081 -> 8080 so this
# demo can run beside the main CloudScope app on host port 8080.

services:
  multi-window-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-window-demo:latest
    ports:
      - "8081:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      CLOUDSCOPE_DEMO_MODE: "web"
      CLOUDSCOPE_HOST: "0.0.0.0"
      PORT: "8080"
