# Docker Compose helpers for CloudScope.
#
# Build and run the production-like container:
#   docker compose up --build cloudscope
#   then visit http://localhost:8080
#
# Build and run the development container with src/ mounted:
#   docker compose up --build cloudscope-dev
#   then visit http://localhost:8080
#
# Server-side data mount:
#   create ./data for local compose runs; inside the app use /data.
#   On Oracle/prod, prefer an absolute host path such as /srv/cloudscope/data:/data.

services:
  cloudscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudscope:latest
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      CLOUDSCOPE_REMOTE: "1"
      CLOUDSCOPE_NATIVE: "0"
      CLOUDSCOPE_SINGLE_WINDOW: "1"
      CLOUDSCOPE_RELOAD: "0"
      CLOUDSCOPE_HOST: "0.0.0.0"
      PORT: "8080"
      CLOUDSCOPE_DATA_DIR: "/data"
      CLOUDSCOPE_SAMPLE_DATA_DIR: "/data/shared/sample-data"
      CLOUDSCOPE_DEMO_SESSION_QUOTA_MB: "500"
      CLOUDSCOPE_DEMO_MAX_UPLOAD_MB: "250"
      CLOUDSCOPE_DEMO_MAX_SESSION_AGE_HOURS: "24"
    volumes:
      - ./data:/data

  cloudscope-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudscope:dev
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      CLOUDSCOPE_REMOTE: "1"
      CLOUDSCOPE_NATIVE: "0"
      CLOUDSCOPE_SINGLE_WINDOW: "1"
      CLOUDSCOPE_RELOAD: "0"
      CLOUDSCOPE_HOST: "0.0.0.0"
      PORT: "8080"
      CLOUDSCOPE_DATA_DIR: "/data"
      CLOUDSCOPE_SAMPLE_DATA_DIR: "/data/shared/sample-data"
      CLOUDSCOPE_DEMO_SESSION_QUOTA_MB: "500"
      CLOUDSCOPE_DEMO_MAX_UPLOAD_MB: "250"
      CLOUDSCOPE_DEMO_MAX_SESSION_AGE_HOURS: "24"
    volumes:
      - ./src:/app/src
      - ./data:/data
