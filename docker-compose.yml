# Docker Compose helpers for CloudScope.
#
# Stamped production-like web deploy (recommended on macOS and Oracle):
#   ./packaging/deploy_cloudscope_web.sh
# Writes src/cloudscope/_build_info.py, then builds/starts `cloudscope`.
# Bare `docker compose up --build cloudscope` without a stamp fails the
# Dockerfile presence check.
#
# Build and run the production-like container (after stamping):
#   python3 packaging/write_build_info.py
#   docker compose up --build -d cloudscope
#   then visit http://localhost:8080
#
# Build and run the development container with src/ mounted:
#   python3 packaging/write_build_info.py   # required once per image build
#   docker compose up --build cloudscope-dev
#   then visit http://localhost:8080
#   Note: same Dockerfile hard-requires the stamp at build time. The ./src
#   bind mount then shadows the image stamp; App Info may show development
#   fallbacks unless a host _build_info.py remains present while running.
#
# Web/single-window runtime env and startup: docs-dev/cloudscope_single_window_runtime.md
#
# Server-side data mount:
#   create ./data for local compose runs; inside the app use /data.
#   On Oracle/prod, prefer an absolute host path such as /srv/cloudscope/data:/data.
#
# Manning manuscript preset (optional sibling repo):
#   ../cloudscope-data/data/manning_velocity_20260625 on host ->
#   /data/presets/manning_velocity_20260625 in container (read-only).
#   Create the host folder before ``docker compose up``; empty dirs disable the menu item.

services:
  cloudscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudscope:latest
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      CLOUDSCOPE_REMOTE: "1"
      CLOUDSCOPE_NATIVE: "0"
      CLOUDSCOPE_SINGLE_WINDOW: "1"
      CLOUDSCOPE_RELOAD: "0"
      CLOUDSCOPE_HOST: "0.0.0.0"
      PORT: "8080"
      CLOUDSCOPE_DATA_DIR: "/data"
      CLOUDSCOPE_SAMPLE_DATA_DIR: "/data/shared/sample-data"
      CLOUDSCOPE_DEMO_SESSION_QUOTA_MB: "500"
      CLOUDSCOPE_DEMO_MAX_UPLOAD_MB: "250"
      CLOUDSCOPE_DEMO_MAX_SESSION_AGE_HOURS: "24"
      # CLOUDSCOPE_PRESET_DATA_MANNING: "/data/presets/manning_velocity_20260625"
    volumes:
      - ./data:/data
      - ../cloudscope-data/data/manning_velocity_20260625:/data/presets/manning_velocity_20260625:ro

  cloudscope-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudscope:dev
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      CLOUDSCOPE_REMOTE: "1"
      CLOUDSCOPE_NATIVE: "0"
      CLOUDSCOPE_SINGLE_WINDOW: "1"
      CLOUDSCOPE_RELOAD: "0"
      CLOUDSCOPE_HOST: "0.0.0.0"
      PORT: "8080"
      CLOUDSCOPE_DATA_DIR: "/data"
      CLOUDSCOPE_SAMPLE_DATA_DIR: "/data/shared/sample-data"
      CLOUDSCOPE_DEMO_SESSION_QUOTA_MB: "500"
      CLOUDSCOPE_DEMO_MAX_UPLOAD_MB: "250"
      CLOUDSCOPE_DEMO_MAX_SESSION_AGE_HOURS: "24"
      CLOUDSCOPE_PRESET_DATA_MANNING: "/data/presets/manning_velocity_20260625"
    volumes:
      - ./src:/app/src
      - ./data:/data
      - ../cloudscope-data/data/manning_velocity_20260625:/data/presets/manning_velocity_20260625:ro
